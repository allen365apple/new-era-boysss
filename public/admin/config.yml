backend:
  name: github
  repo: allen365apple/new-era-boysss
  branch: main
  base_url: https://new-era-boysss.pages.dev
  auth_endpoint: /api/auth

site_url: https://new-era-boysss.pages.dev
media_folder: src/assets/uploads
public_folder: /assets/uploads

locale: zh_Hant

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    description: 先用「待審稿」篩選文章。確認內容後，關閉「草稿」並儲存，就會發布到網站。
    folder: src/content/blog
    create: true
    delete: false
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    extension: md
    format: frontmatter
    media_folder: ../../assets/uploads
    public_folder: ../../assets/uploads
    summary: "{{episode}}｜{{title}}｜草稿：{{draft}}"
    sortable_fields: [pubDate, episode, title, commit_date]
    view_filters:
      - label: 待審稿
        field: draft
        pattern: true
      - label: 已發布
        field: draft
        pattern: false
    fields:
      - label: 標題
        name: title
        widget: string
        required: true

      - label: 草稿（審完關閉即可發布）
        name: draft
        widget: boolean
        default: true
        hint: 保持開啟時不會出現在公開網站；全文確認後關閉並儲存，就會自動部署上線。

      - label: 摘要（SEO 用）
        name: description
        widget: text
        required: true
        hint: 建議 50–160 字，會顯示在 Google 搜尋結果

      - label: 發布日期
        name: pubDate
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: false

      - label: 集數
        name: episode
        widget: string
        required: false
        hint: 例如 EP52

      - label: 本集標題（原集名）
        name: episodeTitle
        widget: string
        required: false
        hint: Podcast 上的完整集名

      - label: 主持人
        name: hosts
        widget: string
        required: false
        hint: 例如 柏文、孝成、博志

      - label: 來賓
        name: guests
        widget: string
        required: false
        hint: 例如 方念萱老師

      - label: 議題分類
        name: topics
        widget: select
        multiple: true
        required: false
        options:
          - { label: 男性特權, value: 男性特權 }
          - { label: 情感腳本, value: 情感腳本 }
          - { label: 性別凝視, value: 性別凝視 }
          - { label: 身份認同, value: 身份認同 }
          - { label: 在地事件, value: 在地事件 }
          - { label: 多元對話, value: 多元對話 }
          - { label: 聽眾互動, value: 聽眾互動 }

      - label: 收聽連結
        name: listenLinks
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: SoundOn, name: soundon, widget: url, required: false }
          - { label: Spotify, name: spotify, widget: url, required: false }
          - { label: Apple Podcasts, name: apple, widget: url, required: false }
          - { label: KKBOX, name: kkbox, widget: url, required: false }

      - label: 封面圖
        name: coverImage
        widget: image
        required: false
        hint: 可手動上傳；若留白，同步工具會依集數使用 SoundOn RSS 的該集封面

      - label: AI 整理內容
        name: aiGenerated
        widget: boolean
        default: true
        hint: 勾選表示本文由 AI 整理自 Podcast 逐字稿

      - label: 內文
        name: body
        widget: markdown
        required: true
