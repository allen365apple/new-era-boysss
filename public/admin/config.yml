backend:
  name: github
  repo: allen365apple/new-era-boysss
  branch: main
  base_url: https://new-era-boysss.pages.dev
  auth_endpoint: /api/auth

site_url: https://new-era-boysss.pages.dev
media_folder: src/assets/uploads
public_folder: /assets/uploads

locale: zh_Hant

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    description: 自動文章會直接發布；若發現錯誤，可在這裡修改並儲存。需要暫時下架時再開啟「草稿」。
    folder: src/content/blog
    create: true
    delete: false
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    extension: md
    format: frontmatter
    media_folder: ../../assets/uploads
    public_folder: ../../assets/uploads
    summary: "{{episode}}｜{{title}}｜草稿：{{draft}}"
    sortable_fields: [pubDate, episode, title, commit_date]
    view_filters:
      - label: 待審稿
        field: draft
        pattern: true
      - label: 已發布
        field: draft
        pattern: false
    fields:
      - label: 標題
        name: title
        widget: string
        required: true

      - label: 草稿（開啟會暫停公開）
        name: draft
        widget: boolean
        default: false
        hint: 預設關閉並直接公開；若要暫時下架文章，開啟後儲存即可。

      - label: 摘要（SEO 用）
        name: description
        widget: text
        required: true
        hint: 建議 50–160 字，會顯示在 Google 搜尋結果

      - label: 文章發布日期
        name: pubDate
        widget: datetime
        required: true
        date_format: YYYY-MM-DD
        time_format: false
        hint: 這篇文章在本站發布的日期

      - label: 節目上線日期
        name: episodeDate
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        hint: 該集 Podcast 在各平台上線的日期

      - label: 集數
        name: episode
        widget: string
        required: false
        hint: 例如 EP52

      - label: 本集標題（原集名）
        name: episodeTitle
        widget: string
        required: false
        hint: Podcast 上的完整集名

      - label: 主持人
        name: hosts
        widget: string
        required: false
        hint: 例如 柏文、孝成、博志

      - label: 來賓
        name: guests
        widget: string
        required: false
        hint: 例如 方念萱老師

      - label: 議題分類
        name: topics
        widget: select
        multiple: true
        required: false
        options:
          - { label: 男性困境, value: 男性困境 }
          - { label: 情感腳本, value: 情感腳本 }
          - { label: 性別凝視, value: 性別凝視 }
          - { label: 身份認同, value: 身份認同 }
          - { label: 在地事件, value: 在地事件 }
          - { label: 多元對話, value: 多元對話 }
          - { label: 聽眾互動, value: 聽眾互動 }

      - label: 收聽連結
        name: listenLinks
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: SoundOn, name: soundon, widget: url, required: false }
          - { label: Spotify, name: spotify, widget: url, required: false }
          - { label: Apple Podcasts, name: apple, widget: url, required: false }
          - { label: KKBOX, name: kkbox, widget: url, required: false }

      - label: 封面圖
        name: coverImage
        widget: image
        required: false
        hint: 可手動上傳；若留白，同步工具會依集數使用 SoundOn RSS 的該集封面

      - label: AI 整理內容
        name: aiGenerated
        widget: boolean
        default: true
        hint: 勾選表示本文由 AI 整理自 Podcast 逐字稿

      - label: 內文
        name: body
        widget: markdown
        required: true

  - name: pages
    label: 頁面
    label_singular: 頁面
    description: 網站固定頁面的文字內容，儲存後會自動重新部署。
    files:
      - name: about
        label: 關於節目
        file: src/content/pages/about.md
        preview_path: about
        fields:
          - label: 標題
            name: title
            widget: string
            hint: 頁面最上方的大標

          - label: 副標
            name: subtitle
            widget: string
            required: false
            hint: 大標下方那一行

          - label: 頁面摘要（SEO）
            name: description
            widget: text
            hint: 給 Google 與分享預覽使用，不會顯示在頁面上

          - label: 初衷區塊標題
            name: missionTitle
            widget: string
            default: 節目初衷

          - label: 數據區塊標題
            name: statsTitle
            widget: string
            default: 節目數據

          - label: 數據附註
            name: statsNote
            widget: string
            required: false
            hint: 顯示在「節目數據」旁的小字，例如 截至 2026.08；更新數據時只要改這裡

          - label: 節目數據
            name: stats
            widget: list
            required: false
            label_singular: 一筆數據
            summary: "{{fields.num}}｜{{fields.label}}"
            fields:
              - { label: 數字, name: num, widget: string, hint: 例如 55+ }
              - { label: 說明, name: label, widget: string, hint: 例如 已發布集數 }

          - label: 收聽區塊標題
            name: listenTitle
            widget: string
            default: 在這裡收聽節目

          - label: 收聽區塊說明
            name: listenIntro
            widget: string
            required: false

          - label: 節目初衷內文
            name: body
            widget: markdown
            required: true
            # 保留富文字模式（多數編輯者不熟 Markdown）。注意 Decap 3.x 在
            # 「編號清單項目內含粗體」時合併項目會崩潰，因此本文改用段落呈現重點。
            hint: 可直接編輯文字。若編輯器出現異常，可切到 Markdown 模式繼續
