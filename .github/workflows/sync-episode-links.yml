name: Sync episode links and covers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: sync-episode-links
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync episode links and covers
        run: npm run sync:episode-links -- --write
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit updated episode data
        run: |
          if git diff --quiet -- src/content/blog src/assets/episode-covers; then
            echo "No episode data changes."
            exit 0
          fi
          git config user.name "新世紀直男戰士同步機器人"
          git config user.email "allen365apple@users.noreply.github.com"
          git add src/content/blog src/assets/episode-covers
          git commit -m "chore(content): sync episode links and covers"
          git push origin main
